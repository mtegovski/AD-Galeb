<header
  id="global-header"
  class="group sticky top-0 z-50 bg-white/95 backdrop-blur shadow-sm transition-shadow duration-300 data-scrolled:shadow-md"
  [attr.data-scrolled]="isScrolled() ? '' : null">
  <div
    class="container mx-auto flex h-16 items-center justify-between gap-4 px-4 lg:h-24">
    <a routerLink="" class="flex shrink-0 items-center" (click)="closeMobileMenu()">
      <img
        [ngSrc]="'assets/galeb_logo.jpg'"
        width="566"
        height="200"
        priority
        alt="АД Галеб"
        class="h-12 w-auto origin-left transition-transform duration-300 lg:h-20 lg:group-data-scrolled:scale-[0.7]">
    </a>

    <!-- Desktop navigation -->
    <nav class="hidden lg:flex items-center gap-8" i18n-aria-label="@@navMenuAria" aria-label="Мени">
      <a routerLink="trips" routerLinkActive="!text-[var(--primary-color)] after:scale-x-100" ariaCurrentWhenActive="page"
         class="relative py-2 font-medium text-[var(--dark-text-color)] transition-colors hover:text-[var(--primary-color)]
                after:absolute after:inset-x-0 after:-bottom-0.5 after:h-0.5 after:rounded-full after:bg-[var(--primary-color)]
                after:scale-x-0 after:transition-transform after:duration-200 hover:after:scale-x-100"
         i18n="@@navRoutes">Релации</a>
      <a routerLink="about" routerLinkActive="!text-[var(--primary-color)] after:scale-x-100" ariaCurrentWhenActive="page"
         class="relative py-2 font-medium text-[var(--dark-text-color)] transition-colors hover:text-[var(--primary-color)]
                after:absolute after:inset-x-0 after:-bottom-0.5 after:h-0.5 after:rounded-full after:bg-[var(--primary-color)]
                after:scale-x-0 after:transition-transform after:duration-200 hover:after:scale-x-100"
         i18n="@@navAbout">За Нас</a>
      <a routerLink="faq" routerLinkActive="!text-[var(--primary-color)] after:scale-x-100" ariaCurrentWhenActive="page"
         class="relative py-2 font-medium text-[var(--dark-text-color)] transition-colors hover:text-[var(--primary-color)]
                after:absolute after:inset-x-0 after:-bottom-0.5 after:h-0.5 after:rounded-full after:bg-[var(--primary-color)]
                after:scale-x-0 after:transition-transform after:duration-200 hover:after:scale-x-100"
         i18n="@@navFaqShort">Прашања</a>
      <a routerLink="contact" routerLinkActive="!text-[var(--primary-color)] after:scale-x-100" ariaCurrentWhenActive="page"
         class="relative py-2 font-medium text-[var(--dark-text-color)] transition-colors hover:text-[var(--primary-color)]
                after:absolute after:inset-x-0 after:-bottom-0.5 after:h-0.5 after:rounded-full after:bg-[var(--primary-color)]
                after:scale-x-0 after:transition-transform after:duration-200 hover:after:scale-x-100"
         i18n="@@navContact">Контакт</a>
    </nav>

    <div class="flex items-center gap-3 lg:gap-5">
      <!-- Desktop language dropdown -->
      <div #languageMenu class="relative hidden lg:block">
        <button
          type="button"
          class="flex items-center gap-2 rounded-full border border-[var(--primary-color)]/20 bg-[var(--primary-color)]/10 px-3 py-2 text-sm font-semibold text-[var(--dark-text-color)] shadow-sm transition-colors duration-200 hover:bg-[var(--primary-color)]/15 cursor-pointer"
          (click)="toggleLanguageMenu()"
          [attr.aria-expanded]="isLanguageMenuOpen()"
          aria-haspopup="menu"
          i18n-aria-label="@@navLanguage"
          aria-label="Јазик">
          <img
            [ngSrc]="currentLocaleOption.flagSrc"
            width="24"
            height="24"
            [alt]="currentLocaleOption.name"
            class="h-6 w-6 rounded-full object-cover ring-1 ring-black/10">
          <i
            class="fas fa-chevron-down text-[10px] text-[var(--dark-text-color)]/60 transition-transform duration-200"
            [class.rotate-180]="isLanguageMenuOpen()"></i>
        </button>

        <div
          class="absolute right-0 mt-2 w-48 overflow-hidden rounded-2xl border border-[var(--primary-color)]/10 bg-white py-2 shadow-xl z-50"
          [class.hidden]="!isLanguageMenuOpen()"
          role="menu">
          @for (locale of locales; track locale.code) {
            <button
              type="button"
              class="flex w-full items-center gap-3 px-4 py-2.5 text-left text-sm text-[var(--dark-text-color)] transition-colors hover:bg-[var(--primary-color)]/10 cursor-pointer
                     aria-checked:font-semibold aria-checked:text-[var(--primary-color)]"
              role="menuitemradio"
              [attr.aria-checked]="currentLocale === locale.code"
              [attr.lang]="locale.code"
              (click)="switchLocale(locale.code); isLanguageMenuOpen.set(false)">
              <img
                [ngSrc]="locale.flagSrc"
                width="24"
                height="24"
                alt=""
                class="h-6 w-6 rounded-full object-cover ring-1 ring-black/10">
              <span>{{ locale.name }}</span>
            </button>
          }
        </div>
      </div>

      <button
        type="button"
        (click)="bookTicket()"
        class="inline-flex items-center gap-2 rounded-full bg-[var(--primary-color)] px-4 py-2 text-sm font-semibold text-white shadow-sm transition-[box-shadow,filter] duration-200 hover:shadow-md hover:brightness-90 cursor-pointer lg:px-5 lg:text-base">
        <i class="fas fa-ticket-alt"></i>
        <span class="sm:hidden" i18n="@@navBookShort">Резервирај</span>
        <span class="hidden sm:inline" i18n="@@navBookTicket">Резервирај билет</span>
      </button>

      <button
        #menuButton
        type="button"
        class="lg:hidden -mr-2 flex h-10 w-10 items-center justify-center rounded-full text-[var(--dark-text-color)] transition-colors hover:bg-[var(--light-background-color)] cursor-pointer"
        (click)="openMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="mobile-menu"
        aria-label="Отвори мени"
        i18n-aria-label="@@navOpenMenuAria">
        <i class="fas fa-bars text-xl"></i>
      </button>
    </div>
  </div>
</header>

<!-- Mobile menu: slide-in panel. The clipping wrapper keeps the closed (off-screen) panel
     from widening the page, which iOS Safari otherwise lets you scroll to sideways. -->
<div class="fixed inset-0 z-[60] overflow-hidden lg:hidden" [class.pointer-events-none]="!isMobileMenuOpen()">
<div
  class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity duration-300"
  [class.opacity-0]="!isMobileMenuOpen()"
  [class.pointer-events-none]="!isMobileMenuOpen()"
  (click)="closeMobileMenu(true)"
  aria-hidden="true">
</div>

<div
  #menuPanel
  id="mobile-menu"
  class="absolute inset-y-0 right-0 flex w-80 max-w-[85vw] flex-col bg-white shadow-2xl transition-transform duration-300 ease-out"
  [class.translate-x-full]="!isMobileMenuOpen()"
  [attr.inert]="isMobileMenuOpen() ? null : ''"
  role="dialog"
  aria-modal="true"
  i18n-aria-label="@@navMenuAria"
  aria-label="Мени">
  <div class="flex items-center justify-between border-b border-[var(--light-border-color)] px-5 py-4">
    <img
      [ngSrc]="'assets/galeb_logo.jpg'"
      width="566"
      height="200"
      alt="АД Галеб"
      class="h-9 w-auto">
    <button
      #menuCloseButton
      type="button"
      class="-mr-2 flex h-10 w-10 items-center justify-center rounded-full text-[var(--dark-text-color)] transition-colors hover:bg-[var(--light-background-color)] cursor-pointer"
      (click)="closeMobileMenu(true)"
      aria-label="Затвори мени"
      i18n-aria-label="@@navCloseMenuAria">
      <i class="fas fa-times text-xl"></i>
    </button>
  </div>

  <nav class="flex-1 overflow-y-auto overscroll-contain px-3 py-4">
    <a routerLink="trips" routerLinkActive="!bg-[var(--light-background-color)] !text-[var(--primary-color)]" ariaCurrentWhenActive="page"
       (click)="closeMobileMenu()"
       class="flex items-center gap-3 rounded-xl px-4 py-3 text-lg font-medium text-[var(--dark-text-color)] transition-colors hover:bg-[var(--light-background-color)]">
      <i class="fas fa-route w-5 text-center text-[var(--primary-color)]"></i>
      <span i18n="@@navRoutes">Релации</span>
    </a>
    <a routerLink="about" routerLinkActive="!bg-[var(--light-background-color)] !text-[var(--primary-color)]" ariaCurrentWhenActive="page"
       (click)="closeMobileMenu()"
       class="flex items-center gap-3 rounded-xl px-4 py-3 text-lg font-medium text-[var(--dark-text-color)] transition-colors hover:bg-[var(--light-background-color)]">
      <i class="fas fa-bus w-5 text-center text-[var(--primary-color)]"></i>
      <span i18n="@@navAbout">За Нас</span>
    </a>
    <a routerLink="faq" routerLinkActive="!bg-[var(--light-background-color)] !text-[var(--primary-color)]" ariaCurrentWhenActive="page"
       (click)="closeMobileMenu()"
       class="flex items-center gap-3 rounded-xl px-4 py-3 text-lg font-medium text-[var(--dark-text-color)] transition-colors hover:bg-[var(--light-background-color)]">
      <i class="fas fa-circle-question w-5 text-center text-[var(--primary-color)]"></i>
      <span i18n="@@navFaq">Најчесто поставувани прашања</span>
    </a>
    <a routerLink="contact" routerLinkActive="!bg-[var(--light-background-color)] !text-[var(--primary-color)]" ariaCurrentWhenActive="page"
       (click)="closeMobileMenu()"
       class="flex items-center gap-3 rounded-xl px-4 py-3 text-lg font-medium text-[var(--dark-text-color)] transition-colors hover:bg-[var(--light-background-color)]">
      <i class="fas fa-envelope w-5 text-center text-[var(--primary-color)]"></i>
      <span i18n="@@navContact">Контакт</span>
    </a>
  </nav>

  <div class="space-y-4 border-t border-[var(--light-border-color)] px-5 py-5">
    <div>
      <p class="mb-2 text-sm font-semibold text-[var(--gray-text-color)]" i18n="@@navLanguage">Јазик</p>
      <div class="grid grid-cols-3 gap-2" role="group" i18n-aria-label="@@navLanguage" aria-label="Јазик">
        @for (locale of locales; track locale.code) {
          <button
            type="button"
            class="flex flex-col items-center gap-1.5 rounded-xl border border-[var(--light-border-color)] px-1 py-2 text-xs font-semibold text-[var(--dark-text-color)] transition-colors cursor-pointer
                   aria-pressed:border-[var(--primary-color)] aria-pressed:bg-[var(--light-background-color)] aria-pressed:text-[var(--primary-color)]"
            [attr.aria-pressed]="currentLocale === locale.code"
            [attr.lang]="locale.code"
            (click)="switchLocale(locale.code)">
            <img
              [ngSrc]="locale.flagSrc"
              width="24"
              height="24"
              alt=""
              class="h-6 w-6 rounded-full object-cover ring-1 ring-black/10">
            {{ locale.name }}
          </button>
        }
      </div>
    </div>

    <button
      type="button"
      (click)="bookTicket(); closeMobileMenu()"
      class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-[var(--primary-color)] px-5 py-3 font-semibold text-white shadow-sm transition hover:brightness-90 cursor-pointer">
      <i class="fas fa-ticket-alt"></i>
      <span i18n="@@navBookTicket">Резервирај билет</span>
    </button>
  </div>
</div>
</div>
