<section
  class="code-section py-20 bg-gradient-to-br from-[var(--light-background-color)] to-[var(--page-color)] relative overflow-hidden"
  id="sxghxvk">

  <div class="container mx-auto px-4 relative z-10">
    <div class="text-center max-w-3xl mx-auto mb-16">
      <div class="inline-block bg-[var(--surface-color)] text-[var(--primary-color)] px-4 py-2 rounded-full font-semibold text-sm mb-6 shadow-md">
        <i class="fas fa-map-marked-alt mr-2"></i>
        <span i18n="@@ourRoutesBadge">Нашите Релации</span>
      </div>

      <h2
        class="text-4xl sm:text-5xl font-bold text-[var(--dark-text-color)] mb-6">
        <span i18n="@@connectedWith">Поврзани со</span>
        <span i18n="@@allMacedonia"> цела Македонија</span>
      </h2>

      <p class="text-lg text-[var(--gray-text-color)] leading-relaxed" i18n="@@routesSectionDescription">
        Од Охрид до секој главен град во земјата, плус меѓународни релации.
        Редовни поаѓања, удобни возила, професионална услуга.
      </p>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
      <app-relation-card [relation]="OhridRelation" />
      <app-relation-card [relation]="SkopjeRelation" />
      <app-relation-card [relation]="BitolaRelation" />
      <app-relation-card [relation]="KochaniRelation" />
      <app-relation-card [relation]="NisRelation" />
      <app-relation-card [relation]="BelgradeRelation" />
    </div>

    <div class="text-center">
      <a
        routerLink="trips"
        class="inline-flex items-center bg-[var(--primary-color)] text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-[var(--accent2-color)] transition-[background-color,box-shadow] shadow-lg hover:shadow-xl">
        <span i18n="@@routesCtaAllRoutes">Погледни сите релации, распоред и цени</span>
      </a>

      <p class="text-[var(--gray-text-color)] text-sm mt-4">
        <i class="fas fa-info-circle mr-1"></i>
        <span i18n="@@fixedTimetablesNote">Редовни линии со фиксни возни редови</span>
      </p>
    </div>
  </div>
</section>
