<section class="min-h-screen py-20 bg-gradient-to-br from-white to-[var(--light-background-color)]">
  <div class="container mx-auto px-4 max-w-3xl">

    <div class="text-center mb-14">
      <h1
        class="font-[var(--font-family-heading)] text-4xl sm:text-5xl font-bold text-[var(--dark-text-color)] mb-4"
        i18n="@@faqPageTitle">
        Најчесто поставувани прашања
      </h1>
      <p
        class="text-[var(--gray-text-color)] text-lg max-w-xl mx-auto"
        i18n="@@faqPageIntro">
        Одговори на најчестите прашања од нашите патници.
      </p>
    </div>

    <div class="space-y-3">
      @for (faq of faqs; track $index) {
        <div
          class="rounded-2xl border transition-all duration-300 overflow-hidden"
          [style.border-color]="faq.open ? 'var(--primary-color)' : 'var(--light-border-color)'"
          [style.box-shadow]="faq.open ? '0 4px 24px 0 color-mix(in srgb, var(--primary-color) 15%, transparent)' : '0 1px 4px 0 rgba(0,0,0,0.06)'">

          <button
            type="button"
            class="w-full flex items-center gap-4 px-6 py-5 text-left transition-colors duration-200 cursor-pointer"
            [style.background]="faq.open ? 'color-mix(in srgb, var(--primary-color) 6%, white)' : 'white'"
            (click)="toggle($index)"
            [attr.aria-expanded]="faq.open">

            <span
              class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition-colors duration-300"
              [style.background]="faq.open ? 'var(--primary-color)' : 'var(--light-background-color)'"
              [style.color]="faq.open ? 'white' : 'var(--primary-color)'">
              {{ $index + 1 }}
            </span>

            <span class="flex-1 font-semibold text-[var(--dark-text-color)] text-base">
              {{ faq.question }}
            </span>

            <span
              class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center transition-all duration-300"
              [style.background]="faq.open ? 'var(--primary-color)' : 'var(--light-background-color)'">
              <i
                class="fas fa-chevron-down text-xs transition-transform duration-300"
                [style.color]="faq.open ? 'white' : 'var(--primary-color)'"
                [class.rotate-180]="faq.open">
              </i>
            </span>
          </button>

          <div
            class="overflow-hidden transition-all duration-300"
            [style.max-height]="faq.open ? '20rem' : '0'">
            <div class="px-6 pb-6 pt-2 flex gap-4">
              <div class="flex-shrink-0 w-8 flex justify-center">
                <div class="w-0.5 rounded-full bg-[var(--primary-color)]/20 h-full"></div>
              </div>
              <p class="text-[var(--gray-text-color)] leading-relaxed">
                {{ faq.answer }}
              </p>
            </div>
          </div>

        </div>
      }
    </div>

  </div>
</section>
