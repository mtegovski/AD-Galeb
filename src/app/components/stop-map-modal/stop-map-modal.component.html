<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
  (click)="closed.emit()">

  <!-- Modal panel — stop click from bubbling to backdrop -->
  <div
    class="relative w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden"
    (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-[var(--light-border-color)]">
      <div class="flex items-center gap-2 text-[var(--primary-color)]">
        <i class="fas fa-map-marker-alt"></i>
        <h2 class="font-[var(--font-family-heading)] text-lg font-bold text-[var(--dark-text-color)]">
          {{ cityName }}
        </h2>
      </div>
      <button
        class="flex items-center justify-center w-8 h-8 rounded-full hover:bg-[var(--light-background-color)] text-[var(--gray-text-color)] transition"
        (click)="closed.emit()"
        i18n-aria-label="@@closeModalAriaLabel"
        aria-label="Затвори">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Boarding location pills — always shown, active one is highlighted -->
    @if (locations.length > 0) {
      <div class="px-6 pt-4 flex flex-wrap gap-2">
        @for (loc of locations; track loc.lat) {
          <button
            type="button"
            (click)="selectLocation(loc)"
            [class]="loc === selectedLocation
                  ? 'inline-flex items-center gap-1.5 bg-[var(--primary-color)] text-white text-xs font-semibold px-3 py-1.5 rounded-full transition'
                  : 'inline-flex items-center gap-1.5 bg-[var(--light-background-color)] hover:bg-[var(--primary-color)] hover:text-white text-[var(--dark-text-color)] text-xs font-semibold px-3 py-1.5 rounded-full transition'">
            <i class="fas fa-map-pin"></i>
            {{ getStopName(loc) ?? ('Stop ' + ($index + 1)) }}
          </button>
        }
      </div>
    }

    <!-- Map iframe -->
    <div class="px-6 py-4">
      @if (mapUrl) {
        <iframe
          [src]="mapUrl"
          class="w-full rounded-xl border border-[var(--light-border-color)]"
          height="340"
          style="border: 0;"
          loading="lazy"
          i18n-title="@@mapIframeTitle"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"
          title="Карта на постојката">
        </iframe>
      }
    </div>

    <!-- Footer -->
    <div class="px-6 pb-5 flex justify-end">
      <button
        (click)="openInGoogleMaps()"
        class="inline-flex items-center gap-2 text-sm font-semibold text-[var(--primary-color)] hover:underline">
        <i class="fas fa-external-link-alt"></i>
        <span i18n="@@openInMaps">Отвори во Google Maps</span>
      </button>
    </div>
  </div>
</div>
