@if (open()) {
  <div
    class="promo-backdrop fixed inset-0 z-100 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    (click)="close()">

    <!-- Panel — stop clicks from bubbling to the backdrop -->
    <div
      class="promo-panel relative w-full max-w-sm sm:max-w-md lg:max-w-lg"
      (click)="$event.stopPropagation()">

      <a
        [href]="link"
        target="_blank"
        rel="noopener noreferrer"
        (click)="close()"
        class="block rounded-2xl overflow-hidden shadow-2xl">
        <img
          [src]="image"
          [alt]="alt"
          (error)="onImageError()"
          class="block w-full h-auto max-h-[80vh] object-contain bg-white" />
      </a>

      <button
        type="button"
        (click)="close()"
        class="absolute top-3 right-3 flex items-center justify-center w-11 h-11 rounded-full bg-white/90 hover:bg-white text-[var(--dark-text-color)] shadow-lg transition cursor-pointer"
        i18n-aria-label="@@closeModalAriaLabel"
        aria-label="Затвори">
        <i class="fas fa-times text-lg"></i>
      </button>
    </div>
  </div>
}
